name: MetaEd-js Data Standard Artifacts - 5.X

on:
  pull_request:
    branches: ['Branch-DS-5.2.0-ME-3.0.1']

  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
  
env:
  REPOSITORY_DISPATCH_BRANCH: ${{ github.event.client_payload.branch }}
  HEAD_REF:  ${{ GITHUB.HEAD_REF }}
  REF_NAME:  ${{ GITHUB.REF_NAME }}
  REPOSITORY_OWNER: ${{ GITHUB.REPOSITORY_OWNER }}
  PROJECT_VERSION: "5.2.0"
  PROJECT_DESCRIPTION: "The Ed-Fi Data Model 5.2.0"
  DATASTANDARD_VERSION: "DS-5.2.0-ME-3.0.1"
  DB_PASS: temporaryDbP@ssw0rd!

jobs:
  MetaEd-Js-Data-Standard-Artifacts-5:

    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: ${{ env.DB_PASS }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "exit 0" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 3
    strategy:
      fail-fast: false
      matrix:
        TECHNOLOGY_VERSION: ["7.3.0"]
    name:  MetaEd-js-Data-Standard-Artifacts 5.x with ODS ${{ matrix.TECHNOLOGY_VERSION }}
    steps:

    - name: Checkout MetaEd-js
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: Ed-Fi-Alliance-OSS/MetaEd-js
        path: MetaEd-js/

    - name: Checkout Ed-Fi-Model
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: Ed-Fi-Closed/Ed-Fi-Model
        path: Ed-Fi-Model/
        ref: ${{env.DATASTANDARD_VERSION}}

    - name: Confirm that pull request branch exists in Ed-Fi-Model
      shell: pwsh
      working-directory: ./Ed-Fi-Model/
      run: |
        ./eng/build.githubactions.ps1 CheckoutBranch -RelativeRepoPath "."

    - name: Create MetaEdConfig
      working-directory: ./Ed-Fi-Model/    
      run: |
        ./eng/CreateMetaEdConfig.ps1 -Workspace ${{ github.workspace }} -ProjectVersion ${{ env.PROJECT_VERSION }} -ProjectDescription ${{ env.PROJECT_DESCRIPTION }} -TechnologyVersion ${{ matrix.TECHNOLOGY_VERSION }}  -MetaEdExtensionName ""
      shell: pwsh

    - name: Print MetaEdConfig-API-${{ matrix.TECHNOLOGY_VERSION }}-DS-5.2.json content
      shell: pwsh
      run: |
        # Define the path to the JSON file
        $jsonFilePath = "${{ github.workspace }}/MetaEd-js/build/MetaEdConfig-API-${{ matrix.TECHNOLOGY_VERSION }}-DS-5.2.json"

        # Read the content of the JSON file
        $jsonContent = Get-Content -Path $jsonFilePath -Raw

        # Convert the JSON content to a pwsh object
        $jsonObject = $jsonContent | ConvertFrom-Json

        # Print the content of the JSON object
        $jsonObject | Format-List -Property *

    - name: Build the model 
      working-directory: ./MetaEd-js/build/  
      run: |
            node index.js --config ./MetaEdConfig-API-${{ matrix.TECHNOLOGY_VERSION }}-DS-5.2.json -a

            $fileCount = (Get-ChildItem "${{ github.workspace }}/MetaEdOutput" -ErrorAction SilentlyContinue | Measure-Object).Count

            if ($fileCount -eq 0) {
                throw "MetaEd build failed - there was no output. Review log above for more information."
            }
      shell: pwsh

    - name: Validate Schema 
      working-directory: ./Ed-Fi-Model/    
      run: |
        ./eng/ValidateSchema.ps1 -Workspace ${{ github.workspace }}
      shell: pwsh

    - name: Install sqlcmd
      run: |
        curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y mssql-tools unixodbc-dev
        echo "/opt/mssql-tools/bin/" >> "$GITHUB_PATH"

    - name: Verify sqlcmd installation
      run: |
        echo $PATH      
        echo "Verifying sqlcmd..."
        sqlcmd "-?" || { echo "sqlcmd not found in PATH"; exit 1; }
        sqlcmd -S localhost -U sa -P "${{ env.DB_PASS }}" -Q "SELECT @@VERSION" || { echo "Failed to connect with sqlcmd"; exit 1; }

    - name: Validate SQL 
      working-directory: ./Ed-Fi-Model/    
      run: |
        ./eng/ValidateSQL.ps1 -Workspace ${{ github.workspace }}  -Password ${{ env.DB_PASS }}
      shell: pwsh

    - name: Upload MetaEd.Artifacts
      if: success()
      uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5
      with:
        name: MetaEdOutput-${{env.DATASTANDARD_VERSION}}-${{ matrix.TECHNOLOGY_VERSION }}
        path: ${{ github.workspace }}/MetaEdOutput/**/*.*        
 