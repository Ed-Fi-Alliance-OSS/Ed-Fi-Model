name: MetaEd-js Extension Artifacts - Student Transcript 4.0 with ODS 7.1

on:
  pull_request:
    branches: ['DS-*']
  push:
    branches: ['DS-*']
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
  
env:
  REPOSITORY_DISPATCH_BRANCH: ${{ github.event.client_payload.branch }}
  HEAD_REF:  ${{ GITHUB.HEAD_REF }}
  REF_NAME:  ${{ GITHUB.REF_NAME }}
  REPOSITORY_OWNER: ${{ GITHUB.REPOSITORY_OWNER }}
  PROJECT_VERSION: "4.0.0"
  PROJECT_DESCRIPTION: "The Ed-Fi Data Model 4.0"
  DATASTANDARD_VERSION: "DS-4.0-ME-3.x"
  TPDM_DATASTANDARD_VERSION: "Data-Standard-v4.0.0"
  TECHNOLOGY_VERSION: "7.1.0"

jobs:
  MetaEd-Js-Data-Standard-Artifacts-StudentTranscript-4-With-ODS-71:

    runs-on: windows-latest

    name:  MetaEd-js Extension Artifacts - Student Transcript 4.0 with ODS 7.1
    steps:
    - name: Support longpaths
      run: git config --system core.longpaths true
    
    - name: Check for Azure token
      if: ${{ env.REPOSITORY_OWNER == 'Ed-Fi-Alliance-OSS' && env.AZURE_ARTIFACT_NUGET_KEY == '' }}
      run: | 
        echo "::error::Missing Azure Token"
        exit 1 

    - name: Checkout MetaEd-js
      uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
      with:
        repository: Ed-Fi-Closed/MetaEd-js
        path: MetaEd-js/
        ref: v4.3.1-dev.23
        token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}

    - name: Checkout Ed-Fi-Model
      uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
      with:
        repository: Ed-Fi-Closed/Ed-Fi-Model
        path: Ed-Fi-Model/
        ref: ${{env.DATASTANDARD_VERSION}}
        token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}

    - name: Is pull request branch exists in Ed-Fi-Model
      shell: powershell
      working-directory: ./Ed-Fi-Model/
      run: |
        ./build.githubactions.ps1 CheckoutBranch -RelativeRepoPath "."

    - name: Checkout ODS
      uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
      with:
        repository: Ed-Fi-Alliance-OSS/Ed-Fi-ODS
        path: MetaEdExtensionSource

    - name: Is pull request branch exists in Ed-Fi-ODS
      shell: powershell
      working-directory: ./Ed-Fi-Model/
      run: |
        ./build.githubactions.ps1 CheckoutBranch -RelativeRepoPath "../MetaEdExtensionSource" 
         
    - name: Clean up folders except StudentTranscriptMetaEd for MetaEdExtensionSource
      shell: powershell
      run: |
        Get-ChildItem MetaEdExtensionSource -Exclude Samples | Remove-Item -Recurse -Force
        Get-ChildItem MetaEdExtensionSource/Samples/Extensions/StudentTranscript -Exclude StudentTranscriptMetaEd | Remove-Item -Recurse -Force
        Get-ChildItem MetaEdExtensionSource/Samples/Extensions -Exclude StudentTranscript | Remove-Item -Recurse -Force
        Get-ChildItem MetaEdExtensionSource/Samples -Exclude Extensions | Remove-Item -Recurse -Force
        cd MetaEdExtensionSource/Samples/Extensions/StudentTranscript/StudentTranscriptMetaEd
        mv * ../../../..

    - name: Create MetaEdConfig
      working-directory: ./Ed-Fi-Model/    
      run: |
        ./CreateMetaEdConfig.ps1 -Workspace ${{ github.workspace }} -ProjectVersion ${{ env.PROJECT_VERSION }} -ProjectDescription ${{ env.PROJECT_DESCRIPTION }} -TechnologyVersion ${{ env.TECHNOLOGY_VERSION }} -MetaEdExtensionName "SampleStudentTranscript"
      shell: powershell

    - name: Print MetaEdConfig-API-${{ env.TECHNOLOGY_VERSION }}-DS-4.0.json content
      shell: powershell
      run: |
        # Define the path to the JSON file
        $jsonFilePath = "${{ github.workspace }}/MetaEd-js/build/MetaEdConfig-API-${{ env.TECHNOLOGY_VERSION }}-DS-4.0.json"

        # Read the content of the JSON file
        $jsonContent = Get-Content -Path $jsonFilePath -Raw

        # Convert the JSON content to a PowerShell object
        $jsonObject = $jsonContent | ConvertFrom-Json

        # Print the content of the JSON object
        $jsonObject | Format-List -Property *
  
    - name: Build the model 
      working-directory: ./MetaEd-js/build/  
      run: |
            node index.js --config ./MetaEdConfig-API-${{ env.TECHNOLOGY_VERSION }}-DS-4.0.json -a

            $fileCount = (Get-ChildItem "${{ github.workspace }}/MetaEdOutput" -ErrorAction SilentlyContinue | Measure-Object).Count

            if ($fileCount -eq 0) {
                throw "MetaEd build failed - there was no output. Review log above for more information."
            }
      shell: powershell


    - name: Validate Schema 
      working-directory: ./Ed-Fi-Model/    
      run: |
        ./ValidateSchema.ps1 -Workspace ${{ github.workspace }} -MetaEdExtensionName "SampleStudentTranscript"
      shell: powershell

    - name: Install sql-server-2019 & sqlpackage
      shell: powershell
      run: |
          choco install sql-server-2019  -y --params "'/IGNOREPENDINGREBOOT /IACCEPTSQLSERVERLICENSETERMS /Q /ACTION=install /INSTANCEID=MSSQLSERVER /INSTANCENAME=MSSQLSERVER /TCPENABLED=1 /UPDATEENABLED=FALSE /FEATURES=SQL,Tools'" --execution-timeout=$installTimeout
          choco install sqlpackage
      
    - name: Validate SQL 
      working-directory: ./Ed-Fi-Model/    
      run: |
        ./ValidateSQL.ps1 -Workspace ${{ github.workspace }} -MetaEdExtensionName "SampleStudentTranscript"
      shell: powershell

    - name: Upload MetaEd.Artifacts
      uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
      with:
        name: MetaEdOutput-${{env.DATASTANDARD_VERSION}}-${{ env.TECHNOLOGY_VERSION }}
        path: ${{ github.workspace }}/MetaEdOutput/**/*.*      

 