name: Publish Data Standard 4.0 Package

on:
  push:
    branches: ['DS-4.*-ME-3.x']   

  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
  
env:
  REPOSITORY_DISPATCH_BRANCH: ${{ github.event.client_payload.branch }}
  HEAD_REF:  ${{ GITHUB.HEAD_REF }}
  REF_NAME:  ${{ GITHUB.REF_NAME }}
  REPOSITORY_OWNER: ${{ GITHUB.REPOSITORY_OWNER }}
  DATASTANDARD_VERSION:  "DS-4.0-ME-3.x"
  ARTIFACTS_API_KEY: ${{ secrets.AZURE_ARTIFACTS_PERSONAL_ACCESS_TOKEN }}
  NPM_REGISTRY: ${{ vars.NPM_REGISTRY }}

jobs:
  Publish-Data-Standard-4:

    runs-on: ubuntu-latest
 
    name:  Publish-Data-Standard-4.0
    steps:
    - name: Check for Azure token
      if: ${{ env.REPOSITORY_OWNER == 'Ed-Fi-Alliance-OSS' && env.AZURE_ARTIFACT_NUGET_KEY == '' }}
      run: | 
        echo "::error::Missing Azure Token"
        exit 1

    - name: Checkout Ed-Fi-Model
      uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
      with:
        repository: Ed-Fi-Closed/Ed-Fi-Model
        path: Ed-Fi-Model/
        ref: ${{env.DATASTANDARD_VERSION}}

    - name: Is pull request branch exists in Ed-Fi-Model
      shell: pwsh
      working-directory: ./Ed-Fi-Model/
      run: |
        ./build.githubactions.ps1 CheckoutBranch -RelativeRepoPath "."

    - name: Setup Node
      uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65 # v4.0.0
      with:
        node-version: "18"

    - name: Copy specific folders and package.json to temporary directory
      working-directory: ./Ed-Fi-Model/
      shell: pwsh       
      run: |
        mkdir MetaEd.Artifacts
        $dirs = @("Association", "Choice", "Common", "Descriptor", "Domain", "DomainEntity", "Enumeration", "Interchange", "Shared")
        
        foreach ($dir in $dirs) {
            Copy-Item -Path ./$dir -Destination ./MetaEd.Artifacts/$dir -Recurse
        }
        
        Copy-Item -Path ./package.json -Destination ./MetaEd.Artifacts/

    - name: Create packages
      working-directory: ./Ed-Fi-Model/MetaEd.Artifacts
      # Explicit step is not required for publishing, but it allows us to upload artifacts
      run: npm pack

    - name: Upload MetaEd.Artifacts
      if: success()
      uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
      with:
        name: Data Standard-${{env.DATASTANDARD_VERSION}}
        path: ${{ github.workspace }}/Ed-Fi-Model/MetaEd.Artifacts/**/*.tgz

    - name: Create .npmrc for Azure Artifacts publishing
      run: |
          echo "Configuring .npmrc for ${{ env.NPM_REGISTRY }}"
          set +x  # disable echo to shell so that the base64-encoded API key never escapes into the log.

          # Create the user .npmrc file with proper settings
          API_KEY=`echo -n "${{ env.ARTIFACTS_API_KEY }}" | base64`
          touch $HOME/.npmrc
          echo "; begin auth token" >> $HOME/.npmrc
          echo ${{ env.NPM_REGISTRY }}:username=ed-fi-alliance >> $HOME/.npmrc
          echo ${{ env.NPM_REGISTRY }}:_password=$API_KEY >> $HOME/.npmrc
          echo ${{ env.NPM_REGISTRY }}:email=techsupport@ed-fi.org >> $HOME/.npmrc
          echo "; end auth token" >> $HOME/.npmrc

    # - name: Publish to Azure DevOps npm registry
    #   working-directory: ./Ed-Fi-Model/MetaEd.Artifacts
    #   run: npm publish --tag dev

 