name: MetaEd-js Data Standard Artifacts - 4.0

on:
  pull_request:
    branches: [main, 'DS-*']
  push:
    branches: [main, 'DS-*']
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
  
env:
  REPOSITORY_DISPATCH_BRANCH: ${{ github.event.client_payload.branch }}
  HEAD_REF:  ${{ GITHUB.HEAD_REF }}
  REF_NAME:  ${{ GITHUB.REF_NAME }}
  REPOSITORY_OWNER: ${{ GITHUB.REPOSITORY_OWNER }}
  PROJECT_VERSION: "5.0.0"
  PROJECT_DESCRIPTION: "The Ed-Fi Data Model 5.0"
  TECHNOLOGY_VERSION: "6.1.0"
  DATASTANDARD_VERSION: "DS-4.0-ME-3.x"
  
  

jobs:
  MetaEd-Js-Data-Standard-Artifacts-4:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        TECHNOLOGY_VERSION: ["6.1.0","7.1.0"]   
    name:  MetaEd-js-Data-Standard-Artifacts 4.0 with ODS ${{ matrix.TECHNOLOGY_VERSION }}
    steps:
    - name: echo distinct ID ${{ github.event.inputs.distinct_id }}
      run:  echo "${{ github.event.inputs.distinct_id }}"
    - name: Check for Azure token
      if: ${{ env.REPOSITORY_OWNER == 'Ed-Fi-Alliance-OSS' && env.AZURE_ARTIFACT_NUGET_KEY == '' }}
      run: | 
        echo "::error::Missing Azure Token"
        exit 1 
    - name: Checkout MetaEd-js
      uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
      with:
        repository: Ed-Fi-Closed/MetaEd-js
        path: MetaEd-js/
        ref: v4.3.1-dev.23
        token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
    - name: Move build to metaed-model-builder
      run: |
        mkdir -p MetaEd-js/metaed-model-builder
        mv MetaEd-js/build/* MetaEd-js/metaed-model-builder/        
    - name: Checkout Ed-Fi-Model
      uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4
      with:
        repository: Ed-Fi-Closed/Ed-Fi-Model
        path: Ed-Fi-Model/
        ref: ${{env.DATASTANDARD_VERSION}}
        token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
    - name: Is pull request branch exists in Ed-Fi-Model
      shell: pwsh
      working-directory: ./Ed-Fi-Model/
      run: |
        ./build.githubactions.ps1 CheckoutBranch -RelativeRepoPath "."        
    - name: Find build.githubactions.ps1
      shell: pwsh
      run: |
        $scriptPath = Get-ChildItem -Path "${{ github.workspace }}" -Filter "build.githubactions.ps1" -Recurse -File | Select-Object -ExpandProperty FullName
        Write-Output "Found script at: $scriptPath"
    - name: Create MetaEdConfig
      working-directory: ./MetaEd-js/
      run: |
        $FolderName = "${{ github.workspace }}\MetaEdOutput"
        if (-not (Test-Path $FolderName)) {
          New-Item $FolderName -ItemType Directory
        }

        $MetaEdConfigBase = @{}

        $emptyList = New-Object System.Collections.ArrayList

        $projectPaths = New-Object System.Collections.ArrayList
        $projectPaths.Add("${{ github.workspace }}\Ed-Fi-Model")

        $projectList = New-Object System.Collections.ArrayList
        $projectList.Add(@{"namespaceName"="EdFi";"projectName"="Ed-Fi";"projectVersion"="${{env.PROJECT_VERSION}}";"projectExtension"="";"description"="${{env.PROJECT_DESCRIPTION}}";})
        $metaEdConfiguration = @{
                                  "artifactDirectory"="${{ github.workspace }}\MetaEdDeploy";
                                  "deployDirectory"="";
                                  "pluginTechVersion"=@{};
                                  "projects"=$projectList;
                                  "projectPaths"=$projectPaths;
                                  "pluginConfigDirectories"=$emptyList;
                                  "defaultPluginTechVersion"="${{ matrix.TECHNOLOGY_VERSION }}";
                                  "allianceMode"=$true;                            
                              }

        $MetaEdConfigBase.Add("metaEdConfiguration",$metaEdConfiguration)

        $FilePath = 'metaed-model-builder\MetaEdConfig-API-${{ matrix.TECHNOLOGY_VERSION }}-DS-4.0.json'
        $MetaEdConfigBase | ConvertTo-Json -Depth 100 | Out-File -FilePath $FilePath -NoNewline -Encoding Ascii
      shell: pwsh
    - name: Check for Node.js
      run: |
        if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
          Write-Host "Node.js is not installed. Please install Node.js to proceed."
          exit 1
        } else {
          node --version
        }
      shell: pwsh 
    - name: Configure npm registry
      run: |
        npm config set registry https://registry.npmjs.org/
        npm config set "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}"
      shell: pwsh

    - name: Build the model 
      working-directory: ./MetaEd-js/metaed-model-builder/  
      run: |
        node . ${{ github.workspace }}/MetaEd-js/metaed-model-builder/index.js --config . ${{ github.workspace }}/MetaEd-js/metaed-model-builder/MetaEdConfig-API-${{ matrix.TECHNOLOGY_VERSION }}-DS-4.0.json -a

        $fileCount = (Get-ChildItem ${{ github.workspace }}/Ed-Fi-Model/MetaEdDeploy -ErrorAction SilentlyContinue | Measure-Object).Count

        if ($fileCount -eq 0) {
            throw "MetaEd build failed - there was no output. Review log above for more information."
        }
      shell: pwsh
    - name: Validate Schema 
      working-directory: ./Ed-Fi-Model/    
      run: |
        function Test-Schema {
          [CmdletBinding()]
          param(
              [parameter(mandatory = $false)]
              [ValidateScript( { Test-Path $_ })]
              [string] $Path,

              [parameter(mandatory = $false)]
              [Xml.Schema.XmlSchemaInclude] $SchemaInclude
          )

          try {
              $elapsed = Use-StopWatch {
                  $script:schemaPath = Get-Item $Path
                  $script:schema = New-Object Xml.Schema.XmlSchemaInclude

                  $script:stream = $schemaPath.OpenRead()
                  $schema.Schema = [Xml.Schema.XmlSchema]::Read($stream, $null)

                  if ($SchemaInclude) {
                      $schema.Schema.Includes.Add($SchemaInclude) | Out-Null
                  }

                  $schemaSet = New-Object Xml.Schema.XmlSchemaSet
                  $schemaSet.Add($schema.Schema) | Out-Null
                  $schemaSet.Compile()
              }
              Write-Result $true $schemaPath.Name $elapsed
              return $schema
          } catch {
              Write-Result $false $schemaPath.Name $elapsed $_.Exception
          } finally {
              if ($stream -is [System.IDisposable]) {
                  $stream.Dispose()
              }
          }
        }

        function Test-InterchangeSchema {
          [CmdletBinding()]
          param(
              [parameter(mandatory = $false)]
              [ValidateScript( { Test-Path $_ })]
              [string] $Path,

              [parameter(mandatory = $false)]
              [Xml.Schema.XmlSchemaInclude] $CoreSchema,

              [parameter(mandatory = $false)]
              [string] $Filter = "Interchange*.xsd"
          )

          $interchanges = Get-ChildItem $Path -Filter $Filter

          foreach ($interchange in $interchanges) {
              $interchangePath = Get-Item $interchange.FullName

              try {
                  $elapsed = Use-StopWatch {
                      $script:stream = $interchangePath.OpenRead()
                      $schema = [Xml.Schema.XmlSchema]::Read($stream, $null)

                      $schema.Includes.Add($CoreSchema) | Out-Null

                      $schemaSet = New-Object Xml.Schema.XmlSchemaSet
                      $schemaSet.Add($schema) | Out-Null
                      $schemaSet.Compile()
                  }
                  Write-Result $true $interchange.Name $elapsed
              } catch {
                  Write-Result $false $interchange.Name $elapsed $_.Exception
              } finally {
                  if ($stream -is [System.IDisposable]) {
                      $stream.Dispose()
                  }
              }
          }
        }

        function Write-Result {
          [CmdletBinding()]
          param(
              [parameter(mandatory = $true)]
              [boolean] $Passed,

              [parameter(mandatory = $true)]
              [string] $Name,

              [parameter(mandatory = $false)]
              [string] $Elapsed,

              [parameter(mandatory = $false)]
              $Exception
          )
          if ($Elapsed -ne $null) {
              $Elapsed = "($Elapsed`ms)"
          }
          if ($Passed) {
              Write-Host " PASS " -BackgroundColor Green -ForegroundColor Black -NoNewline
              Write-Host " $Name $Elapsed"
          } else {
              Write-Host " FAIL " -BackgroundColor Red -ForegroundColor Black -NoNewline
              Write-Host " $Name"
              if ($Exception -ne $null) {
                  Write-Error $Exception.Message
              }
          }
        }

        function Use-StopWatch {
          param(
              [parameter(mandatory = $true)]
              [ValidateNotNullOrEmpty()]
              [scriptblock] $ScriptBlock
          )
          $elapsed = [System.Diagnostics.Stopwatch]::StartNew()
          . $ScriptBlock
          return $elapsed.ElapsedMilliseconds
        }

        $Error.Clear()
        Write-Host " "

        $coreSchemaPath = "${{ github.workspace }}\MetaEdDeploy\edfi\XSD\Ed-Fi-Core.xsd"
        $interchangePath = "${{ github.workspace }}\MetaEdDeploy\edfi\Interchange"

        $elapsed = Use-StopWatch {
        $coreSchema = Test-Schema $coreSchemaPath
          Test-InterchangeSchema $interchangePath $coreSchema

        }
        Write-host "`r`n Validation finished in $elapsed`ms. `r`n"
      shell: pwsh
    - name: Validate SQL 
      working-directory: ./Ed-Fi-Model/    
      run: |
        function Test-SQL {
            [System.Reflection.Assembly]::LoadWithPartialName('Microsoft.SqlServer.SMO') | Out-Null

            $script:databseCSB   = New-Object System.Data.Common.DbConnectionStringBuilder $true
            $databseCSB.Server   = 'localhost'
            $databseCSB.Provider = 'SQLNCLI11'
            $databseCSB.Database = "MetaEd_SQL_Validation_Test"

            $server   = New-Object 'Microsoft.SqlServer.Management.Smo.Server' $databseCSB.Server
            try {
                $server.KillDatabase($databseCSB.Database)
            } catch {
                Write-Host $_
                $Error.Clear()
            }

            $database = New-Object 'Microsoft.SqlServer.Management.Smo.Database' ($server, $databseCSB.Database)
            $database.RecoveryModel = [Microsoft.SqlServer.Management.Smo.RecoveryModel]::Simple
            $database.Create()

            $conn = new-object Microsoft.SqlServer.Management.Common.ServerConnection
            $conn.ConnectionString = "Database=$($databseCSB.Database); Data Source=$($databseCSB.Server); Persist Security Info=True; Trusted_Connection=True; Connection Timeout=120"
            $conn.StatementTimeout = 60
            $srv = New-Object 'Microsoft.SqlServer.Management.Smo.Server' ($conn)

            $scripts = @()

            $basePath = '${{ github.workspace }}\MetaEdDeploy'
            $latestSqlServerScriptPath = Join-Path $basePath 'edfi\Database\SQLServer\ODS'
            $deprecatedScriptPath = Join-Path $basePath 'ODS-SQLServer'

            if (Test-Path $latestSqlServerScriptPath) {
                $structurePath = Join-Path $latestSqlServerScriptPath 'Structure'
                $dataPath = Join-Path $latestSqlServerScriptPath 'Data'

                if (Test-Path $structurePath) {
                    $scripts += Get-ChildItem $structurePath -Filter '*.sql'
                }
                if (Test-Path $dataPath) {
                    $scripts += Get-ChildItem $dataPath -Filter '*.sql'
                }

                if (Test-Path $structurePath) {
                    $structureSubTypePaths = Get-ChildItem $structurePath -Directory
                    foreach ($subTypePath in $structureSubTypePaths) {
                        $scripts += Get-ChildItem $subTypePath.FullName -Filter '*.sql' -Recurse
                    }
                }
                if (Test-Path $dataPath) {
                    $dataSubTypePaths = Get-ChildItem $dataPath -Directory
                    foreach ($subTypePath in $dataSubTypePaths) {
                        $scripts += Get-ChildItem $subTypePath.FullName -Filter '*.sql' -Recurse
                    }
                }
            }
            elseif (Test-Path $deprecatedScriptPath) {
                $scripts = Get-ChildItem $deprecatedScriptPath -Filter '*.sql'
            }

            foreach ($script in $scripts) {
                try {
                    $elapsed = Use-StopWatch {
                        $contents = Get-Content "$($script.FullName)"
                        $sql = [string]::Join([Environment]::NewLine, $contents);
                        $srv.ConnectionContext.ExecuteNonQuery($sql) | Out-Null
                    }
                    Write-Result $true $script.Name $elapsed
                } catch {
                    Write-Result $false $script.Name $elapsed $_.Exception
                }
            }
        }

        function Write-Result {
            [CmdletBinding()]
            param(
                [parameter(mandatory = $true)]
                [boolean] $Passed,

                [parameter(mandatory = $true)]
                [string] $Name,

                [parameter(mandatory = $false)]
                [string] $Elapsed,

                [parameter(mandatory = $false)]
                $Exception
            )
            if ($Elapsed -ne $null) {
                $Elapsed = "($Elapsed`ms)"
            }
            if ($Passed) {
                Write-Host " PASS " -BackgroundColor Green -ForegroundColor Black -NoNewline
                Write-Host " $Name $Elapsed"
            } else {
                Write-Host " FAIL " -BackgroundColor Red -ForegroundColor Black -NoNewline
                Write-Host " $Name $Elapsed`r`n"
                if ($Exception -ne $null) {
                    Write-Error $Exception
                }
            }
        }

        function Use-StopWatch {
            param(
                [parameter(mandatory = $true)]
                [ValidateNotNullOrEmpty()]
                [scriptblock] $ScriptBlock
            )
            $elapsed = [System.Diagnostics.Stopwatch]::StartNew()
            . $ScriptBlock
            return $elapsed.ElapsedMilliseconds
        }

        $Error.Clear()
        Write-Host " "
        $elapsed = Use-StopWatch {
            Test-SQL
        }
        Write-host "`r`n Validation finished in $elapsed`ms. `r`n"
        if ($Error.Count -gt 0) {
            exit 1
        }
      shell: pwsh
    - name: Upload log
      if: ${{ always() }}
      uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
      with:
        name: Build-${{env.DATASTANDARD_VERSION}}-${{ matrix.TECHNOLOGY_VERSION }}.Log
        path: /home/runner/.npm/_logs/*.log
    - name: Upload MetaEd.Artifacts
      if: success()
      uses: actions/upload-artifact@26f96dfa697d77e81fd5907df203aa23a56210a8 # v4.3.0
      with:
        name: MetaEdDeploy-${{env.DATASTANDARD_VERSION}}-${{ matrix.TECHNOLOGY_VERSION }}.zip
        path: ${{ github.workspace }}\MetaEdDeploy\*.*
 