name: MetaEd-js All Extension Artifacts With ODS 7.X

on:
  pull_request:
    branches: ['DS-6.*']

  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
  
env:
  REPOSITORY_DISPATCH_BRANCH: ${{ github.event.client_payload.branch }}
  HEAD_REF:  ${{ GITHUB.HEAD_REF }}
  REF_NAME:  ${{ GITHUB.REF_NAME }}
  REPOSITORY_OWNER: ${{ GITHUB.REPOSITORY_OWNER }}
  PROJECT_VERSION: "6.0.0"
  PROJECT_DESCRIPTION: "The Ed-Fi Data Model 6.0.0"
  DATASTANDARD_VERSION:  ${{ github.event.repository.default_branch }}
  DB_PASS: temporaryDbP@ssw0rd!

jobs:
  MetaEd-Js-All-Extension-Artifacts-With-ODS-7X:

    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: ${{ env.DB_PASS }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "exit 0" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 3
    strategy:
      fail-fast: false
      matrix:
        TECHNOLOGY_VERSION: ["7.3.0"]
        EXTENSION_NAME: ["Homograph","SampleStudentTranscript","Sample","SampleAlternativeEducationProgram"]        

    name: MetaEd-js ${{ matrix.EXTENSION_NAME }} Extension Artifacts With ODS ${{ matrix.TECHNOLOGY_VERSION }}
    steps:

    - name: Check for Azure token
      if: ${{ env.REPOSITORY_OWNER == 'Ed-Fi-Alliance-OSS' && env.AZURE_ARTIFACT_NUGET_KEY == '' }}
      run: | 
        echo "::error::Missing Azure Token"
        exit 1 

    - name: Checkout Ed-Fi-Model
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: Ed-Fi-Closed/Ed-Fi-Model
        path: Ed-Fi-Model/
        ref: ${{env.DATASTANDARD_VERSION}}

    - name: Is pull request branch exists in Ed-Fi-Model
      shell: pwsh
      working-directory: ./Ed-Fi-Model/
      run: |
        ./eng/build.githubactions.ps1 CheckoutBranch -RelativeRepoPath "."

    - name: Checkout MetaEd-js
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: Ed-Fi-Closed/MetaEd-js
        path: MetaEd-js/
        token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}

    - name: Checkout Ed-Fi-ODS-Implementation
      if: matrix.EXTENSION_NAME == 'Homograph'  || matrix.EXTENSION_NAME == 'Sample'
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: Ed-Fi-Alliance-OSS/Ed-Fi-ODS-Implementation
        path: MetaEdExtensionSource/

    - name: Is pull request branch exists in Ed-Fi-ODS-Implementation
      if: matrix.EXTENSION_NAME == 'Homograph'  || matrix.EXTENSION_NAME == 'Sample'
      shell: pwsh
      working-directory: ./Ed-Fi-Model/
      run: |
        ./eng/build.githubactions.ps1 CheckoutBranch -RelativeRepoPath "../MetaEdExtensionSource" 
  
    - name: Checkout ODS
      if: matrix.EXTENSION_NAME == 'SampleStudentTranscript' || matrix.EXTENSION_NAME == 'SampleAlternativeEducationProgram'
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: Ed-Fi-Alliance-OSS/Ed-Fi-ODS
        path: MetaEdExtensionSource

    - name: Is pull request branch exists in Ed-Fi-ODS
      if: matrix.EXTENSION_NAME == 'SampleStudentTranscript' || matrix.EXTENSION_NAME == 'SampleAlternativeEducationProgram'
      shell: pwsh
      working-directory: ./Ed-Fi-Model/
      run: |
        ./eng/build.githubactions.ps1 CheckoutBranch -RelativeRepoPath "../MetaEdExtensionSource" 

    - name: Clean up folders except AlternativeEducationProgramMetaEd for MetaEdExtensionSource
      if: matrix.EXTENSION_NAME == 'SampleAlternativeEducationProgram'    
      shell: pwsh
      run: |
        Get-ChildItem MetaEdExtensionSource -Exclude Samples | Remove-Item -Recurse -Force
        Get-ChildItem MetaEdExtensionSource/Samples/Extensions/AlternativeEducationProgram -Exclude AlternativeEducationProgramMetaEd | Remove-Item -Recurse -Force
        Get-ChildItem MetaEdExtensionSource/Samples/Extensions -Exclude AlternativeEducationProgram | Remove-Item -Recurse -Force
        Get-ChildItem MetaEdExtensionSource/Samples -Exclude Extensions | Remove-Item -Recurse -Force
        cd MetaEdExtensionSource/Samples/Extensions/AlternativeEducationProgram/AlternativeEducationProgramMetaEd
        mv * ../../../..

    - name: Clean up folders except StudentTranscriptMetaEd for MetaEdExtensionSource
      if: matrix.EXTENSION_NAME == 'SampleStudentTranscript'    
      shell: pwsh
      run: |
        Get-ChildItem MetaEdExtensionSource -Exclude Samples | Remove-Item -Recurse -Force
        Get-ChildItem MetaEdExtensionSource/Samples/Extensions/StudentTranscript -Exclude StudentTranscriptMetaEd | Remove-Item -Recurse -Force
        Get-ChildItem MetaEdExtensionSource/Samples/Extensions -Exclude StudentTranscript | Remove-Item -Recurse -Force
        Get-ChildItem MetaEdExtensionSource/Samples -Exclude Extensions | Remove-Item -Recurse -Force
        cd MetaEdExtensionSource/Samples/Extensions/StudentTranscript/StudentTranscriptMetaEd
        mv * ../../../..

    - name: Clean up folders except HomographMetaEd for MetaEdExtensionSource
      if: matrix.EXTENSION_NAME == 'Homograph'    
      shell: pwsh
      run: |
        Get-ChildItem MetaEdExtensionSource -Exclude Extensions | Remove-Item -Recurse -Force
        Get-ChildItem MetaEdExtensionSource/Extensions/Homograph/ -Exclude HomographMetaEd | Remove-Item -Recurse -Force
        Get-ChildItem MetaEdExtensionSource/Extensions/ -Exclude Homograph | Remove-Item -Recurse -Force

        cd MetaEdExtensionSource/Extensions/Homograph/HomographMetaEd
        mv * ../../..

    - name: Clean up folders except SampleMetaEd for MetaEdExtensionSource
      if: matrix.EXTENSION_NAME == 'Sample'
      shell: pwsh
      run: |
        Get-ChildItem MetaEdExtensionSource -Exclude Extensions | Remove-Item -Recurse -Force
        Get-ChildItem MetaEdExtensionSource/Extensions/Sample/ -Exclude SampleMetaEd | Remove-Item -Recurse -Force
        Get-ChildItem MetaEdExtensionSource/Extensions/ -Exclude Sample | Remove-Item -Recurse -Force

        cd MetaEdExtensionSource/Extensions/Sample/SampleMetaEd
        mv * ../../..

    - name: Create MetaEdConfig
      working-directory: ./Ed-Fi-Model/    
      run: |
        ./eng/CreateMetaEdConfig.ps1 -Workspace ${{ github.workspace }} -ProjectVersion ${{ env.PROJECT_VERSION }} -ProjectDescription ${{ env.PROJECT_DESCRIPTION }} -TechnologyVersion ${{ matrix.TECHNOLOGY_VERSION }} -MetaEdExtensionName ${{ matrix.EXTENSION_NAME }}
      shell: pwsh

    - name: Print MetaEdConfig-API-${{ matrix.TECHNOLOGY_VERSION }}-DS-6.0.json content
      shell: pwsh
      run: |
        # Define the path to the JSON file
        $jsonFilePath = "${{ github.workspace }}/MetaEd-js/build/MetaEdConfig-API-${{ matrix.TECHNOLOGY_VERSION }}-DS-6.0.json"

        # Read the content of the JSON file
        $jsonContent = Get-Content -Path $jsonFilePath -Raw

        # Convert the JSON content to a pwsh object
        $jsonObject = $jsonContent | ConvertFrom-Json

        # Print the content of the JSON object
        $jsonObject | Format-List -Property * 
     
    - name: Build the model 
      working-directory: ./MetaEd-js/build/  
      run: |
            node index.js --config ./MetaEdConfig-API-${{ matrix.TECHNOLOGY_VERSION }}-DS-6.0.json -a

            $fileCount = (Get-ChildItem "${{ github.workspace }}/MetaEdOutput" -ErrorAction SilentlyContinue | Measure-Object).Count

            if ($fileCount -eq 0) {
                throw "MetaEd build failed - there was no output. Review log above for more information."
            }
      shell: pwsh
  
    - name: Validate Schema 
      working-directory: ./Ed-Fi-Model/    
      run: |
        ./eng/ValidateSchema.ps1 -Workspace ${{ github.workspace }} -MetaEdExtensionName ${{ matrix.EXTENSION_NAME }}
      shell: pwsh

    - name: Install sqlcmd
      run: |
        curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y mssql-tools unixodbc-dev
        echo 'export PATH=/opt/mssql-tools/bin:$PATH' >>"${GITHUB_ENV}"

    - name: Verify sqlcmd installation
      run: |
        echo "Verifying sqlcmd..."
        sqlcmd "-?" || { echo "sqlcmd not found in PATH"; exit 1; }
        sqlcmd -S localhost -U sa -P "${{ env.DB_PASS }}" -Q "SELECT @@VERSION" || { echo "Failed to connect with sqlcmd"; exit 1; }

    - name: Validate SQL 
      working-directory: ./Ed-Fi-Model/    
      run: |
        ./eng/ValidateSQL.ps1 -Workspace ${{ github.workspace }} -MetaEdExtensionName ${{ matrix.EXTENSION_NAME }} -Password ${{ env.DB_PASS }}
      shell: pwsh

    - name: Upload MetaEd.Artifacts
      uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5
      with:
        name: MetaEdOutput-${{env.DATASTANDARD_VERSION}}-${{ matrix.TECHNOLOGY_VERSION }}- ${{ matrix.EXTENSION_NAME }}
        path: ${{ github.workspace }}/MetaEdOutput/**/*.*          

        
 