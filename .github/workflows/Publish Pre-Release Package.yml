name: Publish Pre-Release Package

on:
  pull_request:
    types: [closed]
    branches: ['DS-*']

  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
  
env:
  REPOSITORY_DISPATCH_BRANCH: ${{ github.event.client_payload.branch }}
  HEAD_REF:  ${{ GITHUB.HEAD_REF }}
  REF_NAME:  ${{ GITHUB.REF_NAME }}
  REPOSITORY_OWNER: ${{ GITHUB.REPOSITORY_OWNER }}
  ARTIFACTS_API_KEY: ${{ secrets.AZURE_ARTIFACTS_PERSONAL_ACCESS_TOKEN }}
  NPM_REGISTRY: ${{ vars.NPM_REGISTRY }}

jobs:
  Publish-Pre-Release:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    name:  Publish Pre-Release Package
    steps:
    - name: Check for Azure token
      if: ${{ env.REPOSITORY_OWNER == 'Ed-Fi-Alliance-OSS' && env.ARTIFACTS_API_KEY == '' }}
      run: | 
        echo "::error::Missing Azure Token"
        exit 1

    - name: Checkout Ed-Fi-Model
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{env.REF_NAME}}
        fetch-depth: 0

    - name: Current latest tag version
      run: |
        current=$(git describe --tags $(git rev-list --tags --max-count=1))
        echo "Current: $current"

    - name: Get version changes
      id: versions
      run: |
        if [ ${{ github.event_name }} == 'pull_request' ]; then
          suggested=$(cat lerna.json | jq -r .version)
          current=$(git describe --tags $(git rev-list --tags --max-count=1))
          echo "Versions: Lerna: $suggested. Current: $current"
          echo "update-required=$([[ "$suggested" != "$current" ]] && echo true)" >>$GITHUB_OUTPUT
        fi

    - name: Update version number
      if: steps.versions.outputs.update-required == 'true'
      run: npx lerna version prerelease --exact --no-git-tag-version --preid pre --force-publish --yes

    - name: Set version number as GitHub variable
      if: steps.versions.outputs.update-required == 'true'
      id: set-version
      run: |
        version=$(cat lerna.json | jq -r .version)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Version: $version"

    - name: Git Status
      run: |
        # For debugging
        git status

    - name: Commit new version number
      uses: planetscale/ghcommit-action@25309d8005ac7c3bcd61d3fe19b69e0fe47dbdde #v0.2.20
      if: steps.versions.outputs.update-required == 'true'
      with:
        commit_message: "${{steps.set-version.outputs.version}}"
        repo: ${{ github.repository }}
        branch: ${{ env.REF_NAME }}     
      env:
        GITHUB_TOKEN: ${{secrets.PRIVATE_REPO_READ_TOKEN}}

    - name: Create package
      # Explicit step is not required for publishing, but it allows us to upload artifacts
      run: npm pack --workspaces

    - name: Upload npm package as artifact
      if: steps.versions.outputs.update-required == 'true'
      uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5
      with:
        name: ${{ steps.set-version.outputs.version }}
        path: ${{ github.workspace }}/*.tgz

    - name: Create .npmrc for Azure Artifacts publishing
      if: steps.versions.outputs.update-required == 'true' && env.ARTIFACTS_API_KEY != ''
      run: |
          echo "Configuring .npmrc for ${{ env.NPM_REGISTRY }}"
          set +x  # disable echo to shell so that the base64-encoded API key never escapes into the log.

          # Create the user .npmrc file with proper settings
          API_KEY=`echo -n "${{ env.ARTIFACTS_API_KEY }}" | base64`
          touch $HOME/.npmrc
          echo "; begin auth token" >> $HOME/.npmrc
          echo ${{ env.NPM_REGISTRY }}:username=ed-fi-alliance >> $HOME/.npmrc
          echo ${{ env.NPM_REGISTRY }}:_password=$API_KEY >> $HOME/.npmrc
          echo ${{ env.NPM_REGISTRY }}:email=techsupport@ed-fi.org >> $HOME/.npmrc
          echo "; end auth token" >> $HOME/.npmrc

    - name: Publish to Azure DevOps npm registry
      if: steps.versions.outputs.update-required == 'true' && env.ARTIFACTS_API_KEY != ''
      run: npm publish --workspaces --tag dev

 